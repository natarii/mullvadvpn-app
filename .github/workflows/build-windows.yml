---
# Standalone Windows installer build for this fork.
#
# Extracted from the upstream `build-windows` job in desktop-e2e.yml, minus the
# end-to-end test machinery (which needs self-hosted runners). Reuses Mullvad's
# own mullvad-build-env composite action, so the toolchain (Rust, the 32-bit
# NSIS target, protoc, msbuild, node) and the required submodules are set up the
# same way upstream does it.
#
# Runs on a standard GitHub-hosted windows-latest runner, which is free with
# unlimited minutes on public repositories.

name: Build Windows installer

on:
  push:
    branches:
      - tailscale-lan-bypass
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      # by default the longest path a filename can have in git on windows is 260
      # characters, which the build can exceed.
      - name: Set git config for long paths
        run: git config --system core.longpaths true

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - uses: ./.github/actions/mullvad-build-env

      - name: Build app
        shell: bash
        run: ./build.sh --optimize

      - name: Upload installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: '!cancelled()'
        with:
          name: windows-build
          path: .\dist\*.exe
          retention-days: 7
